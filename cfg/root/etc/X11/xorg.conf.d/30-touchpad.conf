# libinput replaces xf86-input-synaptics and the long-dead xf86-input-mtrack.
# Wayland users: configure this in the compositor instead (see README).
Section "InputClass"
    Identifier      "Apple touchpad (libinput)"
    MatchIsTouchpad "on"
    MatchDriver     "libinput"
    Option "Tapping"           "on"
    Option "TappingButtonMap"  "lmr"          # 1 finger = left, 2 = middle, 3 = right
    Option "ClickMethod"       "clickfinger"  # physical click: 1 finger = left, 2 = right, 3 = middle
    Option "NaturalScrolling"  "true"
    Option "DisableWhileTyping" "true"
EndSection
