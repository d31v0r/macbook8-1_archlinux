# Apple keyboard behaviour (module: hid_apple)
# Apply with: sudo mkinitcpio -P && reboot   (or write to /sys/module/hid_apple/parameters/ for a live test)

# fnmode: 0 = disabled, 1 = media keys by default (Fn = F1..F12), 2 = F1..F12 by default (Fn = media keys)
options hid_apple fnmode=2

# ISO keyboards (05ac:0253 in the legacy dumps): if ` and < are swapped, uncomment:
#options hid_apple iso_layout=0

# Swap Option and Command, if you want PC-like Alt/Super placement:
#options hid_apple swap_opt_cmd=1
