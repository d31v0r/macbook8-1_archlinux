# In-kernel b43 + firmware (b43-firmware from the AUR). Remove broadcom-wl(-dkms) first, and do NOT blacklist bcma (b43 needs it for the BCM4331).
# HT-PHY limits per the kernel docs: no 5 GHz, no 802.11n features.

# Bluetooth shares the radio; without this pairing can fail (ArchWiki, MacBookPro8,x):
options b43 btcoex=0
